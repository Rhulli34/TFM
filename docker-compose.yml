services:
  api:
    build: .
    image: fnr-api:latest
    ports:
      - "${PORT:-7860}:${PORT:-7860}"
    env_file:
      - .env          # supplies OPENAI_API_KEY (and optionally NEWS_API_KEY, PORT)
    environment:
      APP_ENV: prod   # overrides any APP_ENV in .env
    volumes:
      # Dev override: mounts the local DB on top of the baked-in image snapshot so
      # re-ingestion on the host is reflected immediately without rebuilding.
      # Remove this line on serverless platforms (HF Spaces, Fly.io) — the image
      # is self-contained and runs without any host volume.
      - ./data/processed/radar.db:/home/user/app/data/processed/radar.db:ro
      # Persist LLM-generated briefing markdown outside the container lifecycle.
      - ./reports/briefings:/home/user/app/reports/briefings
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:${PORT:-7860}/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
